name: Production run

# Production output. Runs from main only: the schedule and manual dispatch both resolve
# against the default branch, and the job refuses anything else outright.
on:
  schedule:
    # ABS-EE is filed monthly, a few weeks after each reporting period ends.
    - cron: '0 6 5 * *'
  workflow_dispatch:
    inputs:
      periods:
        description: 'Reporting periods per trust'
        required: false
        default: '3'
      force:
        description: 'Re-ingest even when the content hash already succeeded'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-run
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FIDA_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=fida;Username=fida;Password=fida_ci'

jobs:
  ingest:
    name: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fida
          POSTGRES_PASSWORD: fida_ci
          POSTGRES_DB: fida
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fida -d fida"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Refuse to run outside main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The production run is only valid from main; this ref is ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache key for the month
        id: period
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # ABS-EE exhibits are immutable once filed, and an accession number is part of each
      # cache file's name, so a restored cache means those exhibits are not downloaded
      # again. Keyed by month because that is the filing cadence.
      - name: Restore the SEC download cache
        uses: actions/cache@v4
        with:
          path: .cache/SecAbsEe
          key: sec-abs-ee-${{ steps.period.outputs.month }}
          restore-keys: |
            sec-abs-ee-

      - name: Build
        run: dotnet build -c Release -warnaserror

      - name: Apply migrations
        run: dotnet run --project src/DataAcquisition.Cli -c Release --no-build -- migrate

      - name: Ingest
        id: ingest
        # pipefail matters: without it the exit status of this step is tee's, not the
        # CLI's, and a run with a failed source reports success. The first production run
        # did exactly that - one source failed, 8 of 9 loaded, and the workflow went green.
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/DataAcquisition.Cli -c Release --no-build -- \
            ingest \
            --periods ${{ github.event.inputs.periods || '3' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} \
            2>&1 | tee ingestion.log
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

      - name: Run status
        if: always()
        run: dotnet run --project src/DataAcquisition.Cli -c Release --no-build -- status --limit 50

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production run"
            echo
            echo '```'
            grep -E '^\s+(Succeeded|Failed|Skipped)|=>' ingestion.log || tail -20 ingestion.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the report
        run: dotnet run --project src/DataAcquisition.Cli -c Release --no-build -- report --out ./site

      - name: Upload the report for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Upload ingestion logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-log
          path: ingestion.log
          retention-days: 30

  # Deployment is a separate job so the report is only published when ingestion succeeded.
  # A failed source fails the ingest job, and this job never runs.
  deploy:
    name: deploy
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
