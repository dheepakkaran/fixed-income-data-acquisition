name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror -c Release

      - name: Unit tests
        run: >
          dotnet test tests/DataAcquisition.UnitTests
          --no-build -c Release --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Integration tests (Testcontainers)
        run: >
          dotnet test tests/DataAcquisition.IntegrationTests
          --no-build -c Release --logger "trx;LogFileName=integration.trx"
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          for f in TestResults/*.trx; do
            total=$(grep -o 'total="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            passed=$(grep -o 'passed="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            failed=$(grep -o 'failed="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            echo "- \`$(basename "$f")\`: ${passed}/${total} passed, ${failed} failed" >> "$GITHUB_STEP_SUMMARY"
          done
          for c in TestResults/*/coverage.cobertura.xml; do
            rate=$(grep -o 'line-rate="[0-9.]*"' "$c" | head -1 | grep -o '[0-9.]*')
            pct=$(awk -v r="$rate" 'BEGIN{printf "%.1f", r*100}')
            echo "- coverage \`$(basename "$(dirname "$c")")\`: ${pct}% lines" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  # Analyses the performance of pre-production code: runs the benchmarks and compares them
  # with benchmarks/baseline.json, which is captured from main after each release.
  #
  # Enforcing on release pull requests into main, report-only on pull requests into develop.
  # Reasoning in docs/decisions.md D17: a short BenchmarkDotNet job on a shared runner is
  # noisy enough that blocking every feature branch on it would train people to ignore it,
  # while a release into production is worth waiting for a clean read.
  perf-gate:
    name: perf-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The default GITHUB_TOKEN cannot comment on a pull request: the first run failed with
    # "Resource not accessible by integration (addComment)" after the gate itself had already
    # passed.
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fida
          POSTGRES_PASSWORD: fida_ci
          POSTGRES_DB: fida_bench
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fida -d fida_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FIDA_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=fida_bench;Username=fida;Password=fida_ci'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Decide whether the gate is enforcing
        id: mode
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "enforcing=true"  >> "$GITHUB_OUTPUT"
            echo "flag="           >> "$GITHUB_OUTPUT"
          else
            echo "enforcing=false" >> "$GITHUB_OUTPUT"
            echo "flag=--report-only" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build -c Release -warnaserror

      - name: Run benchmarks
        run: >
          dotnet run --project benchmarks/DataAcquisition.Benchmarks
          -c Release --no-build -- --filter '*'

      - name: Performance gate
        run: >
          dotnet run --project tools/PerfGate -c Release --no-build --
          compare
          --results BenchmarkDotNet.Artifacts/results
          --baseline benchmarks/baseline.json
          --threshold 15
          --time-threshold 50
          --comment perf-gate-comment.md
          ${{ steps.mode.outputs.flag }}

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('perf-gate-comment.md') != ''
        continue-on-error: true
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file perf-gate-comment.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/
          retention-days: 14
