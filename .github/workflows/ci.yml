name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror -c Release

      - name: Unit tests
        run: >
          dotnet test tests/DataAcquisition.UnitTests
          --no-build -c Release --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Integration tests (Testcontainers)
        run: >
          dotnet test tests/DataAcquisition.IntegrationTests
          --no-build -c Release --logger "trx;LogFileName=integration.trx"
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          for f in TestResults/*.trx; do
            total=$(grep -o 'total="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            passed=$(grep -o 'passed="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            failed=$(grep -o 'failed="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            echo "- \`$(basename "$f")\`: ${passed}/${total} passed, ${failed} failed" >> "$GITHUB_STEP_SUMMARY"
          done
          for c in TestResults/*/coverage.cobertura.xml; do
            rate=$(grep -o 'line-rate="[0-9.]*"' "$c" | head -1 | grep -o '[0-9.]*')
            pct=$(awk -v r="$rate" 'BEGIN{printf "%.1f", r*100}')
            echo "- coverage \`$(basename "$(dirname "$c")")\`: ${pct}% lines" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
