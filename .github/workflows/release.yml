name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        rid: [linux-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror -c Release

      - name: Unit tests
        run: dotnet test tests/DataAcquisition.UnitTests --no-build -c Release

      # Integration tests need Docker for Testcontainers, which the runner provides.
      - name: Integration tests
        run: dotnet test tests/DataAcquisition.IntegrationTests --no-build -c Release

      - name: Publish self-contained CLI
        run: >
          dotnet publish src/DataAcquisition.Cli
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:TreatWarningsAsErrors=false
          -o publish/${{ matrix.rid }}

      - name: Package
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf "../../fida-cli-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz" .

      - name: Attach to the release
        run: >
          gh release upload "${{ github.ref_name }}"
          "fida-cli-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz"
          --clobber
        env:
          GH_TOKEN: ${{ github.token }}
