services:
  postgres:
    image: postgres:16
    container_name: fida-postgres
    environment:
      POSTGRES_USER: fida
      POSTGRES_PASSWORD: fida_local_dev
      POSTGRES_DB: fida
    ports:
      - "55432:5432"
    volumes:
      - fida-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fida -d fida"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fida-pgdata:
